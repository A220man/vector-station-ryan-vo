name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run backend tests
        run: |
          PYTHONPATH=. .venv/bin/python -m pytest tests/ -v --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-docker:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: voicestudio-backend:test

  frontend-docker:
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: voicestudio-frontend:test

  integration-test:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d --build backend frontend
          sleep 10

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health/ready; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend health check failed"
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5173/; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend health check failed"
          exit 1

      - name: Run integration test - health check
        run: |
          curl -sf http://127.0.0.1:8000/health | grep -q "healthy\|degraded"

      - name: Run integration test - auth flow
        run: |
          # Login
          TOKEN_RESPONSE=$(curl -s -X POST http://127.0.0.1:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "dev", "password": "dev"}')
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r .access_token)
          [ "$ACCESS_TOKEN" != "null" ] && [ -n "$ACCESS_TOKEN" ]

      - name: Run integration test - voices list
        run: |
          curl -sf -H "Authorization: Bearer $ACCESS_TOKEN" \
            http://127.0.0.1:8000/api/voices | jq -e '.voices | length > 0'

      - name: Run integration test - create synthesis
        run: |
          JOB_RESPONSE=$(curl -s -X POST http://127.0.0.1:8000/api/synthesis \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"text": "Integration test", "voice_id": 1}')
          JOB_ID=$(echo $JOB_RESPONSE | jq -r .id)
          [ "$JOB_ID" != "null" ] && [ -n "$JOB_ID" ]

          # Poll for completion
          for i in {1..30}; do
            STATUS=$(curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
              http://127.0.0.1:8000/api/synthesis/$JOB_ID | jq -r .status)
            if [ "$STATUS" = "completed" ]; then
              echo "Synthesis completed"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "Synthesis failed"
              exit 1
            fi
            sleep 1
          done
          echo "Synthesis timed out"
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v